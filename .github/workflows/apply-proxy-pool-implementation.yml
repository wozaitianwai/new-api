name: Clean proxy pool implementation helpers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-proxy-pool-implementation.yml

permissions:
  contents: write

concurrency:
  group: proxy-pool-implementation-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/proxy-pool-failover

      - name: Remove implementation-only files
        run: |
          rm -rf .github/automation
          rm -f .github/workflows/apply-proxy-pool-implementation.yml
          rm -f proxy-pool-implementation.log

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove proxy pool implementation helpers"
          git push origin HEAD:feat/proxy-pool-failover
