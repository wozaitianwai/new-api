name: Apply proxy pool implementation

on:
  push:
    branches:
      - feat/proxy-pool-failover
    paths:
      - .github/automation/proxy-pool-apply.py
  pull_request:
    branches:
      - main
    paths:
      - .github/automation/proxy-pool-apply.py
      - .github/automation/proxy_pool_*.py
      - .github/workflows/apply-proxy-pool-implementation.yml

permissions:
  contents: write

concurrency:
  group: proxy-pool-implementation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/proxy-pool-failover

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Apply implementation with test-first checks
        run: python3 .github/automation/proxy-pool-apply.py > proxy-pool-implementation.log 2>&1

      - name: Upload implementation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-pool-implementation-log
          path: proxy-pool-implementation.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced"
            exit 1
          fi
          git commit -m "feat: add channel proxy pool failover"
          git push origin HEAD:feat/proxy-pool-failover
